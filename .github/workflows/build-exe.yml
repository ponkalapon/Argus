name: Build Desktop (EXE)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron App (EXE)
        working-directory: apps/argus-desktop
        run: npm run electron:dist

      - name: Create or Update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "latest" || gh release create "latest" --title "Argus Latest Build (APK & EXE)" --notes "Latest automated build."
          gh release upload "latest" apps/argus-desktop/releases/electron/*.exe --clobber

